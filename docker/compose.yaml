# Development compose: builds the image locally from this tree.
# For deploys with a prebuilt image use the top-level docker-compose.yml.
# Both files honour the same .env (look in repo root for .env.example).
services:
  ocs:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ${OCS_IMAGE:-sigscale-ocs-local:latest}
    hostname: ${OCS_HOSTNAME:-ocs}
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "${OCS_BIND_HOST:-0.0.0.0}:${OCS_HTTP_PORT_HOST:-8080}:${OCS_HTTP_PORT:-8080}/tcp"
      - "${OCS_BIND_HOST:-0.0.0.0}:${OCS_RADIUS_AUTH_PORT_HOST:-1812}:${OCS_RADIUS_AUTH_PORT:-1812}/udp"
      - "${OCS_BIND_HOST:-0.0.0.0}:${OCS_RADIUS_ACCT_PORT_HOST:-1813}:${OCS_RADIUS_ACCT_PORT:-1813}/udp"
      - "${OCS_BIND_HOST:-0.0.0.0}:${OCS_DIAMETER_ACCT_PORT_HOST:-3868}:${OCS_DIAMETER_ACCT_PORT:-3868}/tcp"
      - "${OCS_BIND_HOST:-0.0.0.0}:${OCS_DIAMETER_AUTH_PORT_HOST:-3869}:${OCS_DIAMETER_AUTH_PORT:-3869}/tcp"
    volumes:
      - ${OCS_DATA_DIR:-../data}/db:/home/otp/db
      - ${OCS_DATA_DIR:-../data}/log:/home/otp/log
      - ${OCS_DATA_DIR:-../data}/ssl:/home/otp/ssl
      - ${OCS_DATA_DIR:-../data}/snmp:/home/otp/snmp
